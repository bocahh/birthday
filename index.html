<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Bocillkuu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }body {
  background: linear-gradient(180deg, #0b1f4d, #112b6b, #183c8f);
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 100vh;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0.35;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(2px);
}

.content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
  animation: fadeIn 2s ease;
}

h1 {
  font-size: 2.4rem;
  margin-bottom: 10px;
  animation: glow 2s infinite alternate;
}

p {
  font-size: 1rem;
  line-height: 1.6;
  max-width: 320px;
  color: #dbe7ff;
}

.heart {
  font-size: 2rem;
  margin-top: 20px;
  animation: pulse 1.5s infinite;
}

.floating {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  animation: float 10s linear infinite;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

@keyframes glow {
  from { text-shadow: 0 0 10px #7aa8ff; }
  to { text-shadow: 0 0 25px #ffffff; }
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(-100px) scale(1.2);
    opacity: 0;
  }
}

.music {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}

button {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 10px 20px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(10px);
}

  </style>
</head>
<body>
  <div class="container"><!-- GANTI video.mp4 dengan video kamu -->
<video autoplay muted loop>
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">
  <h1>Happy Birthday 💙</h1>
  <p>
    buat bocillkuu tersayang,<br><br>
    semoga panjang umur,
    sehat selalu,
    dan tetap sama akuu terus yaa ✨
  </p>

  <div class="heart">🤍</div>
</div>

<div class="music">
  <button onclick="playMusic()">Play Music 🎵</button>
</div>

<!-- GANTI music.mp3 dengan lagu kamu -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

  </div>  <script>
    function playMusic() {
      const music = document.getElementById('bgm');
      music.play();
    }

    for(let i = 0; i < 25; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('floating');
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.animationDuration = (5 + Math.random() * 10) + 's';
      bubble.style.opacity = Math.random();
      bubble.style.width = bubble.style.height = (6 + Math.random() * 15) + 'px';
      document.body.appendChild(bubble);
    }
  </script></body>
</html>
