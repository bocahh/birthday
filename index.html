<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
}

canvas{
display:block;
}

.text{
position:absolute;
bottom:40px;
width:100%;
text-align:center;
color:white;
z-index:10;
pointer-events:none;
}

.text h1{
font-size:50px;
margin:0;
text-shadow:0 0 20px white;
}

.text p{
font-size:20px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="text">
<h1>Happy Birthday 💙</h1>
<p>buat bocillkuu tersayang ✨</p>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152/build/three.module.js';

import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.152/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000,0.002);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

camera.position.set(0,20,80);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

/* CONTROL */

const controls = new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.enablePan = true;

controls.minDistance = 20;

controls.maxDistance = 200;

/* LIGHT */

const light = new THREE.PointLight(
0xffffff,
3
);

light.position.set(0,0,0);

scene.add(light);

/* PLANET */

const planet = new THREE.Mesh(

new THREE.SphereGeometry(10,64,64),

new THREE.MeshStandardMaterial({
color:0xffffff,
emissive:0xffffff,
emissiveIntensity:0.4
})

);

scene.add(planet);

/* RING */

const ring = new THREE.Mesh(

new THREE.TorusGeometry(16,0.15,16,100),

new THREE.MeshBasicMaterial({
color:0xffffff
})

);

ring.rotation.x = Math.PI/2;

scene.add(ring);

/* STARS */

const starsGeometry = new THREE.BufferGeometry();

const starsCount = 15000;

const starsPos = [];

for(let i=0;i<starsCount;i++){

starsPos.push(
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000
);

}

starsGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(starsPos,3)
);

const starsMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:0.7
});

const stars = new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* FOTO */

const loader = new THREE.TextureLoader();

const images = [

"IMG-20260323-WA0066.jpg",
"IMG-20260323-WA0068.jpg",
"IMG-20260323-WA0073.jpg",
"IMG-20260323-WA0105.jpg",
"IMG-20260323-WA0107.jpg",
"IMG-20260323-WA0110.jpg",
"IMG-20260323-WA0117.jpg",
"IMG-20260323-WA0120.jpg"

];

const photos = [];

for(let i=0;i<180;i++){

const img = images[
i % images.length
];

const texture = loader.load(img);

const geometry =
new THREE.PlaneGeometry(7,10);

const material =
new THREE.MeshBasicMaterial({
map:texture,
side:THREE.DoubleSide
});

const photo =
new THREE.Mesh(
geometry,
material
);

/* spiral galaxy */

const angle = i * 0.35;

const radius = 20 + i*0.9;

photo.position.x =
Math.cos(angle)*radius;

photo.position.z =
Math.sin(angle)*radius;

photo.position.y =
(Math.random()-0.5)*20;

/* hadap tengah */

photo.lookAt(0,0,0);

scene.add(photo);

photos.push(photo);

}

/* GALAXY COLOR */

const nebulaGeometry =
new THREE.SphereGeometry(300,64,64);

const nebulaMaterial =
new THREE.MeshBasicMaterial({
color:0x44ff88,
transparent:true,
opacity:0.05,
side:THREE.BackSide
});

const nebula =
new THREE.Mesh(
nebulaGeometry,
nebulaMaterial
);

scene.add(nebula);

/* ANIMATION */

function animate(){

requestAnimationFrame(animate);

stars.rotation.y += 0.0003;

ring.rotation.z += 0.002;

controls.update();

renderer.render(scene,camera);

}

animate();

/* RESPONSIVE */

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
