<!DOCTYPE html><html lang="id">
<head><!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:sans-serif;
}

.container{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top, rgba(0,255,100,0.4), transparent 30%),
radial-gradient(circle at bottom, rgba(255,255,0,0.4), transparent 30%),
black;
}

.stars{
position:absolute;
width:100%;
height:100%;
background:url("https://i.imgur.com/YKY28eT.png");
animation:move 60s linear infinite;
opacity:0.8;
}

@keyframes move{
from{
transform:translateY(0);
}
to{
transform:translateY(-1000px);
}
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:140px;
height:140px;
border-radius:50%;
background:white;
box-shadow:0 0 40px white;
}

.orbit{
position:absolute;
top:50%;
left:50%;
width:500px;
height:500px;
margin-left:-250px;
margin-top:-250px;
border-radius:50%;
animation:spin 25s linear infinite;
}

@keyframes spin{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

.photo{
position:absolute;
width:70px;
height:100px;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.photo:nth-child(1){top:0;left:50%;}
.photo:nth-child(2){bottom:0;left:50%;}
.photo:nth-child(3){left:0;top:50%;}
.photo:nth-child(4){right:0;top:50%;}
.photo:nth-child(5){top:15%;left:15%;}
.photo:nth-child(6){top:15%;right:15%;}
.photo:nth-child(7){bottom:15%;left:15%;}
.photo:nth-child(8){bottom:15%;right:15%;}

.text{
position:absolute;
bottom:60px;
width:100%;
text-align:center;
color:white;
font-size:24px;
font-weight:bold;
text-shadow:0 0 15px white;
padding:20px;
}

.text span{
font-size:16px;
display:block;
margin-top:10px;
font-weight:normal;
}

</style>
</head>

<body>

<div class="container">

<div class="stars"></div>

<div class="center"></div>

<div class="orbit">

<div class="photo">
<img src="https://picsum.photos/200/300?1">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?2">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?3">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?4">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?5">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?6">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?7">
</div>

<div class="photo">
<img src="https://picsum.photos/200/300?8">
</div>

</div>

<div class="text">
Happy Birthday 💖
<span>
buat bocillkuu tersayang ✨
</span>
</div>

</div>

</body>
</html>
