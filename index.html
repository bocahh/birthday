<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💙</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:sans-serif;
}

canvas{
  display:block;
}

.text{
  position:absolute;
  bottom:40px;
  width:100%;
  text-align:center;
  color:white;
  z-index:10;
}

h1{
  font-size:40px;
  margin:0;
  text-shadow:0 0 20px white;
}

p{
  font-size:18px;
}
</style>
</head>

<body>

<div class="text">
  <h1>Happy Birthday 💙</h1>
  <p>buat bocillkuu tersayang ✨</p>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);

camera.position.z = 12;

const starsGeometry = new THREE.BufferGeometry();

const starsCount = 5000;

const posArray = new Float32Array(starsCount * 3);

for(let i=0; i<starsCount*3; i++){
  posArray[i] = (Math.random() - 0.5) * 200;
}

starsGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(posArray,3)
);

const starsMaterial = new THREE.PointsMaterial({
  size:0.2,
  color:"white"
});

const starsMesh = new THREE.Points(
  starsGeometry,
  starsMaterial
);

scene.add(starsMesh);

const loader = new THREE.TextureLoader();

const photos = [
 'IMG-20260323-WA0066.jpg',
 'IMG-20260323-WA0068.jpg',
 'IMG-20260323-WA0073.jpg',
 'IMG-20260323-WA0105.jpg',
 'IMG-20260323-WA0107.jpg',
 'IMG-20260323-WA0110.jpg'
];

const group = new THREE.Group();

photos.forEach((img,index)=>{

  const texture = loader.load(img);

  const geometry = new THREE.PlaneGeometry(3,4);

  const material = new THREE.MeshBasicMaterial({
    map:texture
  });

  const photo = new THREE.Mesh(geometry,material);

  const angle = (index/photos.length) * Math.PI * 2;

  photo.position.x = Math.cos(angle)*6;
  photo.position.z = Math.sin(angle)*6;

  photo.lookAt(0,0,0);

  group.add(photo);

});

scene.add(group);

function animate(){

  requestAnimationFrame(animate);

  group.rotation.y += 0.003;

  starsMesh.rotation.y += 0.0005;

  renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

  camera.aspect = window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
